[package]
name = "pgtui"
version = "0.1.0"
edition = "2021"
description = "A lightweight, vim-first PostgreSQL terminal client"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process"] }
tokio-postgres = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
unicode-width = "0.2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[profile.release]
lto = true
strip = true
codegen-units = 1
